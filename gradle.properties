# Tuned to build on a small machine: 4 GB RAM, 2 cores.
# Without these caps the Gradle and Kotlin daemons will fight the OS for memory
# and the build will thrash. Raise them if the project ever moves to a bigger box.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx768m

# 2 cores: parallel execution buys little and costs memory.
org.gradle.parallel=false
org.gradle.caching=true

# Left off deliberately for now - one less variable while the build is new.
# Worth turning on later as a speedup, once the custom tasks are known good.
org.gradle.configuration-cache=false

android.useAndroidX=true
